# One-time bootstrap. Remove this workflow after the operator has checked the run.
name: Seed BuildKit cache
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    if: github.repository == 'seankoji-com/recovery-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9ec179bc4914ba370ebc899b3dd1d5c83a5067aa
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Seed notes
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./recovery_lab/app
          file: ./recovery_lab/app/Dockerfile
          platforms: linux/amd64
          pull: true
          cache-to: type=gha,scope=notes-linux-amd64,mode=max
      - name: Seed browser
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./recovery_lab/app
          file: ./recovery_lab/app/browser.Dockerfile
          platforms: linux/amd64
          pull: true
          cache-to: type=gha,scope=browser-linux-amd64,mode=max
  verify:
    needs: seed
    if: github.repository == 'seankoji-com/recovery-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9ec179bc4914ba370ebc899b3dd1d5c83a5067aa
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Import notes on a fresh builder
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./recovery_lab/app
          file: ./recovery_lab/app/Dockerfile
          platforms: linux/amd64
          pull: true
          cache-from: type=gha,scope=notes-linux-amd64
      - name: Import browser on a fresh builder
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./recovery_lab/app
          file: ./recovery_lab/app/browser.Dockerfile
          platforms: linux/amd64
          pull: true
          cache-from: type=gha,scope=browser-linux-amd64
