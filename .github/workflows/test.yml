# The browser journey must pass after the source database is destroyed.
name: Recovery drill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so image, dependency and runner drift surfaces without a push.
  schedule:
    - cron: '17 19 * * 1' # Mondays 19:17 UTC (Tuesday morning in Sydney)
permissions:
  contents: read
# Only superseded validations for the same PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Cache the archive, never extracted executables. Verify every cache hit.
      # Digest recorded from the upstream GitHub release asset API for v1.3.2.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/age-cache
          key: age-linux-amd64-v1.3.2-cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
      - name: Install verified age
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = X64
          archive="$RUNNER_TEMP/age-cache/age-v1.3.2-linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/age-cache" "$RUNNER_TEMP/age-bin"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 --output "$archive" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          fi
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/age-bin" --strip-components=1 age/age age/age-keygen
          "$RUNNER_TEMP/age-bin/age" --version | grep -Fx v1.3.2
          "$RUNNER_TEMP/age-bin/age-keygen" --version | grep -Fx v1.3.2
          echo "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - name: Assert age tools before tests
        run: command -v age && command -v age-keygen && test "$(age --version)" = v1.3.2 && test "$(age-keygen --version)" = v1.3.2
      - run: uv run python -m unittest discover -s tests -v
      # Pull the exact runtime tags used by the local build command.
      - name: Pull runtime images
        id: images
        run: |
          uv run python -c 'from recovery_lab.cli import PG, RESTIC, docker; docker("pull", PG, timeout=600); docker("pull", RESTIC, timeout=600)'
          uv run python -c 'from recovery_lab.cli import APP, BROWSER; print(f"app={APP}\nbrowser={BROWSER}")' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Rebuild and load both images from this checkout. Pull refreshes base
      # tags and invalidates dependent layers when their digest changes.
      # Only trusted main pushes publish shared caches; PRs read or build cold.
      # Scheduled drills rebuild dependencies to detect upstream drift.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./recovery_lab/app
          file: ./recovery_lab/app/Dockerfile
          tags: ${{ steps.images.outputs.app }}
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=notes-linux-amd64
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=notes-linux-amd64,mode=max' || '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./recovery_lab/app
          file: ./recovery_lab/app/browser.Dockerfile
          tags: ${{ steps.images.outputs.browser }}
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=browser-linux-amd64
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=browser-linux-amd64,mode=max' || '' }}
      - run: uv run recovery-lab demo
      - run: uv run recovery-lab run .demo/manifest.json --receipt receipts/replay.json
      - run: uv run python tests/failure_drill.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: recovery-receipts
          path: |
            receipts/*.json
            .demo/source-cleanup.json
