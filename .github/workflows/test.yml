# The browser journey must pass after the source database is destroyed.
name: Recovery drill
on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, so image, dependency and runner drift surfaces without a push.
  schedule:
    - cron: '17 19 * * 1' # Mondays 19:17 UTC (Tuesday morning in Sydney)
permissions:
  contents: read
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # The age adapter tests encrypt synthetic fixtures with a throwaway key.
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run recovery-lab build
      - run: uv run recovery-lab demo
      - run: uv run recovery-lab run .demo/manifest.json --receipt receipts/replay.json
      - run: uv run python tests/failure_drill.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: recovery-receipts
          path: |
            receipts/*.json
            .demo/source-cleanup.json
