# The browser journey must pass after the source database is destroyed.
name: Recovery drill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: recovery-lab build
      - run: recovery-lab demo
      - run: recovery-lab run .demo/manifest.json --receipt receipts/replay.json
      - run: python tests/failure_drill.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: recovery-receipts
          path: |
            receipts/*.json
            .demo/source-cleanup.json
