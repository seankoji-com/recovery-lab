# Dependabot version updates. The org-level .github/dependabot.yml is not
# inherited, so this repository declares its own ecosystems.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "type:chore"
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "type:chore"
      - "dependencies"
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # Base images for the synthetic application and the Chromium checker.
  - package-ecosystem: "docker"
    directory: "/recovery_lab/app"
    schedule:
      interval: "weekly"
    labels:
      - "type:chore"
      - "dependencies"
